<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CA ANG Innovation Cell - Building digital tools for Airmen. Replace slow manual workflows with modern apps.">
    <meta property="og:title" content="CA ANG Innovation Cell">
    <meta property="og:description" content="Stop fighting data. Move the mission. Modern digital tools for California Air National Guard.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <title>CA ANG | Innovation Cell</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            scroll-behavior: smooth; 
            background-color: #ffffff;
            font-size: 16px;
            line-height: 1.6;
        }

        /* Skip to main content link for accessibility */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #003087;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            font-weight: bold;
            z-index: 100;
        }
        .skip-link:focus {
            top: 0;
        }

        .hero-gradient {
            background: radial-gradient(circle at 0% 0%, rgba(0, 48, 135, 0.04) 0%, transparent 50%),
                        radial-gradient(circle at 100% 100%, rgba(255, 199, 44, 0.06) 0%, transparent 50%);
        }

        .card-shadow {
            box-shadow: 0 10px 30px -5px rgba(0, 48, 135, 0.05);
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .animate-slide-up {
            animation: slideUp 0.5s ease-out forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-link-active {
            position: relative;
            color: #003087 !important;
        }
        .nav-link-active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #003087;
            border-radius: 2px;
        }

        /* Improved focus states */
        button:focus-visible,
        a:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #003087;
            outline-offset: 2px;
        }

        /* Mobile menu overlay */
        .mobile-menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 40;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Enhanced hover states */
        .hover-lift {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -10px rgba(0, 48, 135, 0.15);
        }

        /* Form validation states */
        .form-error {
            border-color: #dc2626 !important;
            background-color: #fef2f2 !important;
        }
        .form-success {
            border-color: #059669 !important;
        }

        /* Improved touch targets for mobile */
        @media (max-width: 768px) {
            button, a {
                min-height: 44px;
                min-width: 44px;
            }
        }

        /* Progress indicator for process steps */
        .process-step {
            position: relative;
        }
        .process-step::before {
            content: '';
            position: absolute;
            top: 32px;
            left: -6rem;
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, #003087 0%, #e2e8f0 100%);
            z-index: -1;
        }
        .process-step:nth-child(-n+3)::before {
            display: none;
        }
        @media (max-width: 1024px) {
            .process-step::before {
                display: none;
            }
        }

        /* Smooth scroll behavior with offset for sticky nav */
        html {
            scroll-padding-top: 80px;
        }
    </style>
</head>
<body class="text-slate-900 antialiased">
    <!-- Skip to main content for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 20, className = "", ariaLabel = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`} aria-label={ariaLabel} role={ariaLabel ? "img" : "presentation"}></i>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [surveyScore, setSurveyScore] = useState(null);
            const [isMenuOpen, setIsMenuOpen] = useState(false);

            // Update URL when tab changes
            useEffect(() => {
                const path = activeTab === 'home' ? '/' : `/#${activeTab}`;
                window.history.pushState({ tab: activeTab }, '', path);
            }, [activeTab]);

            // Handle browser back/forward
            useEffect(() => {
                const handlePopState = (e) => {
                    if (e.state?.tab) {
                        setActiveTab(e.state.tab);
                    }
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, []);

            // Close mobile menu on escape key
            useEffect(() => {
                const handleEscape = (e) => {
                    if (e.key === 'Escape' && isMenuOpen) {
                        setIsMenuOpen(false);
                    }
                };
                document.addEventListener('keydown', handleEscape);
                return () => document.removeEventListener('keydown', handleEscape);
            }, [isMenuOpen]);

            const navigation = [
                { id: 'home', label: 'Home', icon: 'home' },
                { id: 'process', label: 'How it Works', icon: 'zap' },
                { id: 'library', label: 'Field Guides', icon: 'book-open' },
                { id: 'submit', label: 'Fix a Problem', icon: 'plus-circle' },
                { id: 'join', label: 'Join Us', icon: 'users' }
            ];

            const handleFormSubmit = (e, type) => {
                e.preventDefault();
                const formData = new FormData(e.target);

                let subject, body;
                if (type === 'submit') {
                    subject = 'CA ANG Fix Request';
                    body = `Process Modernization Request

Name: ${formData.get('name')}
Unit: ${formData.get('unit')}

Problem Description:
${formData.get('problem')}

---
Submitted via CA ANG Innovation Cell website`;
                } else {
                    subject = 'CA ANG Fellowship Interest';
                    body = `Fellowship Interest

Email: ${formData.get('email')}
AFSC: ${formData.get('afsc')}

---
Submitted via CA ANG Innovation Cell website`;
                }

                window.location.href = `mailto:blake.carter.10@us.af.mil?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            };

            const Nav = () => (
                <nav className="glass border-b border-slate-200 sticky top-0 z-50" role="navigation" aria-label="Main navigation">
                    <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                        <button 
                            onClick={() => setActiveTab('home')}
                            className="flex items-center gap-4 cursor-pointer group"
                            aria-label="Go to homepage"
                        >
                            <div className="relative w-12 h-12 flex items-center justify-center">
                                <img src="CAANG%20flash.png" alt="California Air National Guard logo" className="w-10 h-10 relative object-contain" />
                            </div>
                            <div className="flex flex-col">
                                <span className="font-extrabold text-lg tracking-tight leading-none text-slate-900">CA ANG</span>
                                <span className="text-xs uppercase font-bold text-[#003087] tracking-widest mt-0.5">Innovation Cell</span>
                            </div>
                        </button>

                        <div className="hidden lg:flex gap-8" role="menubar">
                            {navigation.map(tab => (
                                <button 
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`relative py-1 text-sm font-semibold uppercase tracking-wider transition-all hover:text-[#003087] ${
                                        activeTab === tab.id ? 'nav-link-active' : 'text-slate-500'
                                    }`}
                                    aria-current={activeTab === tab.id ? 'page' : undefined}
                                    role="menuitem"
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </div>

                        <button 
                            onClick={() => setIsMenuOpen(!isMenuOpen)} 
                            className="lg:hidden p-2 text-slate-900"
                            aria-label={isMenuOpen ? "Close menu" : "Open menu"}
                            aria-expanded={isMenuOpen}
                            aria-controls="mobile-menu"
                        >
                            <Icon name={isMenuOpen ? "x" : "menu"} size={28} />
                        </button>
                    </div>

                    {isMenuOpen && (
                        <>
                            <div 
                                className="mobile-menu-overlay lg:hidden" 
                                onClick={() => setIsMenuOpen(false)}
                                aria-hidden="true"
                            />
                            <div 
                                id="mobile-menu"
                                className="lg:hidden bg-white border-t p-6 space-y-3 animate-slide-up shadow-2xl relative z-50"
                                role="menu"
                            >
                                {navigation.map(tab => (
                                    <button 
                                        key={tab.id}
                                        onClick={() => { setActiveTab(tab.id); setIsMenuOpen(false); }}
                                        className={`w-full flex items-center gap-4 px-5 py-4 rounded-xl font-semibold text-sm tracking-wide ${
                                            activeTab === tab.id ? 'bg-blue-50 text-[#003087]' : 'text-slate-600 hover:bg-slate-50'
                                        }`}
                                        role="menuitem"
                                        aria-current={activeTab === tab.id ? 'page' : undefined}
                                    >
                                        <Icon name={tab.icon} size={20} ariaLabel={`${tab.label} icon`} />
                                        {tab.label}
                                    </button>
                                ))}
                            </div>
                        </>
                    )}
                </nav>
            );

            const HomePage = () => (
                <div className="space-y-48 pb-32 hero-gradient">
                    <section className="max-w-6xl mx-auto px-6 pt-24 text-center">
                        <div className="inline-flex items-center gap-3 px-4 py-2 bg-blue-50 border border-blue-100 rounded-full text-[#003087] text-sm font-semibold uppercase tracking-wider mb-10 animate-slide-up">
                            <Icon name="shield-check" size={16} ariaLabel="Shield check icon" />
                            Building Digital Tools for Airmen
                        </div>
                        <h1 className="text-5xl md:text-7xl lg:text-8xl font-black tracking-tight leading-[1.1] text-slate-900 mb-10 animate-slide-up">
                            Stop fighting data. <br/>
                            <span className="text-[#003087]">Move the mission.</span>
                        </h1>
                        <p className="text-xl md:text-2xl text-slate-600 max-w-3xl mx-auto mb-14 leading-relaxed font-medium animate-slide-up" style={{ animationDelay: '0.1s' }}>
                            We replace slow, manual workflows with simple digital apps that work for you, not against you. 
                        </p>
                        <div className="flex flex-col sm:flex-row justify-center gap-6 animate-slide-up" style={{ animationDelay: '0.2s' }}>
                            <button 
                                onClick={() => setActiveTab('submit')} 
                                className="px-10 py-5 bg-[#003087] text-white rounded-2xl font-bold uppercase text-sm tracking-widest hover:bg-[#002147] transition-all shadow-xl hover:shadow-2xl hover:scale-[1.02] flex items-center justify-center gap-3"
                                aria-label="Fix my process - go to submission form"
                            >
                                Fix my process <Icon name="arrow-right" size={20} ariaLabel="Arrow right" />
                            </button>
                            <button 
                                onClick={() => setActiveTab('library')} 
                                className="px-10 py-5 bg-white border-2 border-slate-200 text-slate-700 rounded-2xl font-bold uppercase text-sm tracking-widest hover:border-[#003087] transition-all flex items-center justify-center gap-3"
                                aria-label="View field guides library"
                            >
                                View Field Guides
                            </button>
                        </div>
                    </section>

                    <section className="max-w-6xl mx-auto px-6" aria-label="Comparison of current vs innovation approach">
                        <div className="grid md:grid-cols-2 gap-10 items-stretch">
                            <article className="bg-slate-50 p-12 rounded-[2.5rem] border border-slate-200/60 flex flex-col h-full shadow-sm">
                                <div className="w-14 h-14 bg-white border border-slate-200 rounded-2xl flex items-center justify-center text-slate-400 mb-8 shadow-sm">
                                    <Icon name="clock" size={28} ariaLabel="Clock icon" />
                                </div>
                                <h2 className="text-sm font-black text-slate-400 uppercase tracking-widest mb-2">The Current Way</h2>
                                <h3 className="text-3xl font-extrabold tracking-tight text-slate-800 mb-10">The Paper Burden</h3>
                                <ul className="space-y-8 font-medium text-slate-600" role="list">
                                    <li className="flex items-start gap-5">
                                        <div className="w-6 h-6 bg-red-100 text-red-600 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5" aria-hidden="true"><Icon name="x" size={14} /></div>
                                        <span className="text-lg">Manual spreadsheets that take hours to update.</span>
                                    </li>
                                    <li className="flex items-start gap-5">
                                        <div className="w-6 h-6 bg-red-100 text-red-600 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5" aria-hidden="true"><Icon name="x" size={14} /></div>
                                        <span className="text-lg">Chasing down status updates through email chains.</span>
                                    </li>
                                    <li className="flex items-start gap-5">
                                        <div className="w-6 h-6 bg-red-100 text-red-600 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5" aria-hidden="true"><Icon name="x" size={14} /></div>
                                        <span className="text-lg">Data errors caused by manual hand-offs and typing.</span>
                                    </li>
                                </ul>
                            </article>

                            <article className="bg-white p-12 rounded-[2.5rem] border-2 border-blue-50 card-shadow flex flex-col h-full relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-48 h-48 bg-[#FFC72C]/5 rounded-full -mr-20 -mt-20" aria-hidden="true"></div>
                                <div className="w-14 h-14 bg-[#003087] rounded-2xl flex items-center justify-center text-[#FFC72C] mb-8 shadow-lg">
                                    <Icon name="zap" size={28} ariaLabel="Lightning bolt icon" />
                                </div>
                                <h2 className="text-sm font-black text-[#003087] uppercase tracking-widest mb-2">The Innovation Way</h2>
                                <h3 className="text-3xl font-extrabold tracking-tight text-slate-900 mb-10">The Modern Fix</h3>
                                <ul className="space-y-8 font-semibold text-slate-700" role="list">
                                    <li className="flex items-start gap-5">
                                        <div className="w-6 h-6 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5" aria-hidden="true"><Icon name="check" size={14} /></div>
                                        <span className="text-lg">Live apps that work on tablets and mobile devices.</span>
                                    </li>
                                    <li className="flex items-start gap-5">
                                        <div className="w-6 h-6 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5" aria-hidden="true"><Icon name="check" size={14} /></div>
                                        <span className="text-lg">Automated notifications so you never miss a deadline.</span>
                                    </li>
                                    <li className="flex items-start gap-5">
                                        <div className="w-6 h-6 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5" aria-hidden="true"><Icon name="check" size={14} /></div>
                                        <span className="text-lg">Live dashboards showing mission readiness instantly.</span>
                                    </li>
                                </ul>
                            </article>
                        </div>
                    </section>

                    <section className="max-w-4xl mx-auto px-6 text-center" aria-label="Self-assessment survey">
                        <div className="bg-slate-50 border border-slate-200/60 p-16 md:p-24 rounded-[3.5rem] relative overflow-hidden">
                            <div className="relative z-10">
                                <h2 className="text-sm font-black text-[#003087] uppercase tracking-[0.4em] mb-6">Self-Assessment</h2>
                                <h3 className="text-4xl md:text-5xl font-black tracking-tight text-slate-900 mb-8 leading-tight">Is your unit stuck?</h3>
                                <p className="text-lg text-slate-600 mb-14 max-w-xl mx-auto font-medium">On a scale of 1 to 5, how much does manual paperwork slow down your team every day?</p>

                                {surveyScore === null ? (
                                    <div className="flex flex-wrap justify-center gap-6" role="radiogroup" aria-label="Rate impact of manual paperwork from 1 to 5">
                                        {[1, 2, 3, 4, 5].map(num => (
                                            <button 
                                                key={num} 
                                                onClick={() => setSurveyScore(num)}
                                                className="w-20 h-20 rounded-3xl bg-white border-2 border-slate-100 text-slate-400 font-extrabold hover:border-[#003087] hover:text-[#003087] hover:scale-110 transition-all flex items-center justify-center text-3xl shadow-sm hover:shadow-md"
                                                aria-label={`Rate ${num} out of 5`}
                                                role="radio"
                                                aria-checked="false"
                                            >
                                                {num}
                                            </button>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="animate-slide-up bg-white p-12 rounded-[2rem] card-shadow inline-block max-w-md border border-blue-50" role="alert" aria-live="polite">
                                        <div className="w-16 h-16 bg-blue-50 text-[#003087] rounded-2xl flex items-center justify-center mx-auto mb-8 shadow-sm">
                                            <Icon name="gauge" size={32} ariaLabel="Gauge icon" />
                                        </div>
                                        <h4 className="text-2xl font-extrabold tracking-tight text-slate-900 mb-4">
                                            {surveyScore > 3 ? "Change is Needed" : "Unit is Running Lean"}
                                        </h4>
                                        <p className="text-base text-slate-600 font-medium mb-10 leading-relaxed">
                                            {surveyScore > 3 
                                                ? "Manual friction is taking valuable time away from your mission. We have the tools to help you reclaim those hours." 
                                                : "Excellent. Your unit is high-performing. Help other wings reach this level by joining us as a Fellow."}
                                        </p>
                                        <div className="flex flex-col gap-4">
                                            <button 
                                                onClick={() => setActiveTab('submit')} 
                                                className="w-full py-5 bg-[#003087] text-white rounded-xl font-bold uppercase text-sm tracking-widest shadow-lg hover:bg-[#002147] transition-all"
                                            >
                                                Start a Request
                                            </button>
                                            <button 
                                                onClick={() => setSurveyScore(null)} 
                                                className="text-sm font-bold text-slate-400 uppercase tracking-widest hover:text-slate-700 transition-colors py-2"
                                            >
                                                Reset Gauge
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </section>
                </div>
            );

            const ProcessPage = () => (
                <div className="max-w-6xl mx-auto px-6 py-24">
                    <div className="text-center mb-24">
                        <h2 className="text-sm font-black text-[#003087] uppercase tracking-[0.4em] mb-6">Execution Model</h2>
                        <h1 className="text-5xl md:text-7xl font-black tracking-tight text-slate-900 mb-8">6 Steps to Success</h1>
                        <p className="text-xl text-slate-600 max-w-2xl mx-auto font-medium leading-relaxed">We build tools that Airmen actually enjoy using.</p>
                    </div>

                    <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-12">
                        {[
                            { step: "01", title: "We Observe", desc: "We sit with you to see the friction firsthand. We don't guess—we learn your workflow.", icon: "eye" },
                            { step: "02", title: "We Map It", desc: "We visualize where data is stuck and draw a clear path to a better digital state.", icon: "map" },
                            { step: "03", title: "We Sprint", desc: "Our team builds a functional, working version of your tool in 30 days or less.", icon: "zap" },
                            { step: "04", title: "We Use Your Tools", desc: "We build on the Power Platform and SharePoint you already own. No new accounts.", icon: "box" },
                            { step: "05", title: "We Test Hard", desc: "You use it in the field. If it's slow or confusing, we change it immediately.", icon: "shield-alert" },
                            { step: "06", title: "We Launch", desc: "The tool goes live wing-wide. We keep iterating based on your ongoing feedback.", icon: "rocket" }
                        ].map((item, index) => (
                            <article key={item.step} className="group process-step">
                                <div className="w-16 h-16 bg-slate-50 text-slate-400 rounded-2xl flex items-center justify-center mb-8 group-hover:bg-[#003087] group-hover:text-white transition-all shadow-sm border border-slate-100">
                                    <Icon name={item.icon} size={28} ariaLabel={`${item.title} icon`} />
                                </div>
                                <h3 className="text-2xl font-extrabold tracking-tight mb-4 text-slate-900 flex items-center gap-4">
                                    <span className="text-[#003087]/20 text-lg font-black">{item.step}</span> {item.title}
                                </h3>
                                <p className="text-lg text-slate-600 font-medium leading-relaxed">{item.desc}</p>
                            </article>
                        ))}
                    </div>
                </div>
            );

            const LibraryPage = () => {
                const guides = [
                    { title: 'Innovation Playbook', sub: 'The Product Approach', icon: 'book', color: 'bg-slate-900', url: '/Innovation_Cell/guides/Mission_Ready_Innovation_Field_Guide.pdf' },
                    { title: 'Power App Guide', sub: 'Rapid Deployment', icon: 'layout', color: 'bg-blue-700', url: '/Innovation_Cell/guides/Mission_Power_App_Deployment.pdf' },
                    { title: 'Power BI Briefing', sub: 'Data Dominance', icon: 'bar-chart', color: 'bg-[#003087]', url: '/Innovation_Cell/guides/Data_Dominance_Power_BI_Flight_Briefing.pdf' },
                    { title: 'Automation Mission', sub: 'Power Automate', icon: 'zap', color: 'bg-red-700', url: '/Innovation_Cell/guides/Power_Automate_Mission_Guide.pdf' }
                ];

                return (
                    <div className="max-w-7xl mx-auto px-6 py-24">
                        <div className="text-center mb-24">
                            <h2 className="text-sm font-black text-slate-400 uppercase tracking-[0.4em] mb-6">Strategic Resources</h2>
                            <h1 className="text-5xl md:text-7xl font-black tracking-tight text-slate-900 mb-8 italic">Field Guides</h1>
                            <p className="text-xl text-slate-600 max-w-xl mx-auto font-medium">Step-by-step guides for mission modernization.</p>
                        </div>

                        <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-10">
                            {guides.map((guide, i) => (
                                <a 
                                    key={i} 
                                    href={guide.url} 
                                    download 
                                    className="bg-white p-12 rounded-[2.5rem] border border-slate-200 card-shadow hover-lift transition-all flex flex-col h-full no-underline group"
                                    aria-label={`Download ${guide.title} - ${guide.sub} PDF guide`}
                                >
                                    <div className={`w-14 h-14 ${guide.color} rounded-2xl flex items-center justify-center text-white mb-10 shadow-lg`}>
                                        <Icon name={guide.icon} size={26} ariaLabel={`${guide.title} icon`} />
                                    </div>
                                    <p className="text-xs font-black uppercase tracking-widest text-slate-400 mb-2">{guide.sub}</p>
                                    <h3 className="text-2xl font-extrabold tracking-tight text-slate-900 mb-12 leading-tight group-hover:text-[#003087] transition-colors">{guide.title}</h3>
                                    <div className="mt-auto flex items-center justify-between text-[#003087] font-bold uppercase text-xs tracking-widest pt-8 border-t border-slate-100">
                                        <span>Download PDF</span>
                                        <Icon name="download" size={18} ariaLabel="Download icon" />
                                    </div>
                                </a>
                            ))}
                        </div>
                    </div>
                );
            };

            const SubmitPage = () => (
