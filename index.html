<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA ANG Innovation Cell</title>
    <!-- Tailwind CSS for Modern Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX processing in-browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-white text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, Fragment } = React;

        // Custom Component for Icons
        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [surveyScore, setSurveyScore] = useState(null);
            const [isMenuOpen, setIsMenuOpen] = useState(false);

            const navigation = [
                { id: 'home', label: 'Home' },
                { id: 'process', label: 'How we work' },
                { id: 'library', label: 'Flight Library' },
                { id: 'submit', label: 'Fix a process' },
                { id: 'join', label: 'Join us' }
            ];

            const Nav = () => (
                <nav class="glass border-b border-slate-200 sticky top-0 z-50">
                    <div class="max-w-6xl mx-auto px-6">
                        <div class="flex items-center justify-between h-20">
                            <div class="flex items-center gap-4 group cursor-pointer" onClick={() => setActiveTab('home')}>
                                <div class="relative">
                                    <div class="absolute -inset-1 bg-[#FFC72C] rounded-full blur opacity-20"></div>
                                    <img src="https://upload.wikimedia.org/wikipedia/commons/e/e0/California_Air_National_Guard_USAF_patch.svg" alt="CA ANG" class="w-10 h-10 relative" />
                                </div>
                                <div class="flex flex-col">
                                    <span class="font-black text-slate-900 leading-none text-base uppercase tracking-tighter">CA ANG</span>
                                    <span class="text-[10px] text-[#003087] font-bold uppercase tracking-widest">Innovation Cell</span>
                                </div>
                            </div>
                            
                            <div class="hidden md:flex items-center space-x-2">
                                {navigation.map((tab) => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        class={`px-4 py-2 text-[11px] font-bold uppercase tracking-widest transition-all rounded-md ${
                                            activeTab === tab.id ? 'bg-[#003087] text-white shadow-md' : 'text-slate-500 hover:bg-slate-100 hover:text-slate-900'
                                        }`}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </div>

                            <button onClick={() => setIsMenuOpen(!isMenuOpen)} class="md:hidden text-slate-900 p-2">
                                <Icon name={isMenuOpen ? "x" : "menu"} />
                            </button>
                        </div>
                    </div>
                    {isMenuOpen && (
                        <div class="md:hidden bg-white border-t border-slate-100 px-6 py-6 space-y-3 shadow-xl">
                            {navigation.map((tab) => (
                                <button
                                    key={tab.id}
                                    onClick={() => { setActiveTab(tab.id); setIsMenuOpen(false); }}
                                    class={`block w-full text-left px-4 py-3 rounded-lg text-xs font-bold uppercase tracking-widest ${
                                        activeTab === tab.id ? 'bg-[#003087] text-white' : 'bg-slate-50 text-slate-500'
                                    }`}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                    )}
                </nav>
            );

            const Hero = () => (
                <div class="relative bg-white pt-24 pb-20 px-6 overflow-hidden border-b border-slate-100">
                    <div class="max-w-5xl mx-auto text-center relative z-10 animate-fade-in">
                        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-[#FFC72C]/10 border border-[#FFC72C]/20 mb-10">
                            <Icon name="heart" size={14} className="text-[#C8102E]" />
                            <span class="text-[10px] font-black text-[#003087] uppercase tracking-[0.2em]">Tools built for Airmen</span>
                        </div>
                        <h1 class="text-5xl md:text-7xl font-bold text-slate-900 tracking-tighter mb-8 leading-[0.9]">
                            Stop moving data. <br />
                            <span class="text-[#003087] font-black italic">Start moving the mission.</span>
                        </h1>
                        <p class="text-xl text-slate-600 max-w-2xl mx-auto mb-12 leading-relaxed font-medium">
                            We take the slow, painful parts of your job and make them digital. We build tools that are easy to use so you can focus on being an Airman, not a data courier.
                        </p>
                        <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                            <button onClick={() => setActiveTab('submit')} class="w-full sm:w-auto px-10 py-5 bg-[#003087] text-white text-[11px] font-black uppercase tracking-[0.2em] hover:bg-blue-800 transition-all rounded-sm shadow-xl flex items-center justify-center gap-3 group">
                                Fix a process now <Icon name="arrow-right" size={16} className="group-hover:translate-x-1 transition-transform" />
                            </button>
                            <button onClick={() => setActiveTab('library')} class="w-full sm:w-auto px-10 py-5 bg-white border-2 border-slate-200 text-slate-600 text-[11px] font-black uppercase tracking-[0.2em] hover:border-[#FFC72C] transition-all rounded-sm">
                                View Field Guides
                            </button>
                        </div>
                    </div>
                </div>
            );

            const HomePage = () => (
                <div class="space-y-32 pb-32">
                    <Hero />
                    
                    {/* Visual Guide: The Product Approach */}
                    <section class="max-w-6xl mx-auto px-6">
                        <div class="bg-slate-50 rounded-2xl p-8 md:p-12 border border-slate-200 shadow-sm relative overflow-hidden">
                            <div class="absolute top-0 right-0 p-8 opacity-5 rotate-12">
                                <Icon name="compass" size={160} />
                            </div>
                            <div class="relative z-10 max-w-2xl">
                                <h3 class="text-xs font-black text-[#003087] uppercase tracking-[0.4em] mb-4">Human-Centered Modernization</h3>
                                <h4 class="text-3xl font-black text-slate-900 uppercase tracking-tighter mb-6 text-slate-800">The "Product Approach"</h4>
                                <p class="text-slate-600 font-medium leading-relaxed mb-8">
                                    Our methodology focuses on the user first. We don't build software based on assumptions; we build it based on direct evidence from the Airmen who live the problem.
                                </p>
                                <div class="flex flex-wrap gap-4">
                                    {['User-Focused', 'Iterative', 'Data-Driven'].map(tag => (
                                        <span key={tag} class="px-4 py-2 bg-white border border-slate-200 rounded-lg text-[10px] font-black uppercase tracking-widest text-[#003087]">
                                            {tag}
                                        </span>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Manual vs Modern Comparison */}
                    <section class="max-w-6xl mx-auto px-6">
                        <div class="text-center mb-16">
                            <h2 class="text-xs font-black text-[#003087] uppercase tracking-[0.4em] mb-4">Why we modernize</h2>
                            <h3 class="text-3xl font-black text-slate-900 uppercase tracking-tight">Evolving Mission Workflows</h3>
                        </div>
                        <div class="grid md:grid-cols-2 gap-px bg-slate-200 border border-slate-200 rounded-2xl overflow-hidden shadow-2xl">
                            <div class="bg-slate-50 p-10 space-y-8 opacity-70">
                                <h4 class="text-[10px] font-black uppercase tracking-widest text-slate-400">Legacy Work (Slow)</h4>
                                <ul class="space-y-4">
                                    {["Manual Excel roll-ups that take days.", "Data living in siloed email chains.", "Skilled Airmen acting as data couriers.", "Leadership relying on delayed information."].map((item, i) => (
                                        <li key={i} class="flex gap-4 items-start text-sm text-slate-500">
                                            <Icon name="x" size={18} className="text-slate-300 flex-shrink-0" /> {item}
                                        </li>
                                    ))}
                                </ul>
                            </div>
                            <div class="bg-white p-10 space-y-8 border-l-4 border-[#FFC72C]">
                                <h4 class="text-[10px] font-black uppercase tracking-widest text-[#003087]">Modern Execution (Fast)</h4>
                                <ul class="space-y-4">
                                    {["Automated apps that check data instantly.", "Real-time Power BI dashboards.", "Shared access for the whole unit.", "Built-in accountability and error reduction."].map((item, i) => (
                                        <li key={i} class="flex gap-4 items-start text-sm text-slate-700 font-bold">
                                            <Icon name="check-circle-2" size={18} className="text-[#C8102E] flex-shrink-0" /> {item}
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        </div>
                    </section>

                    {/* Friction Gauge */}
                    <section class="bg-slate-900 py-24 px-6 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1 bg-[#C8102E]"></div>
                        <div class="max-w-3xl mx-auto text-center relative z-10">
                            <h2 class="text-[10px] font-bold text-blue-400 uppercase tracking-[0.5em] mb-12">Identify Friction</h2>
                            <h3 class="text-3xl text-white font-black uppercase tracking-tighter mb-12 leading-tight">How much does paperwork <br/> hinder your mission?</h3>
                            {surveyScore === null ? (
                                <div class="flex flex-wrap justify-center gap-3">
                                    {[1, 2, 3, 4, 5].map(num => (
                                        <button key={num} onClick={() => setSurveyScore(num)} class="w-16 h-16 border-2 border-blue-800 text-blue-300 text-xl font-black hover:border-[#FFC72C] hover:text-[#FFC72C] transition-all rounded-sm flex items-center justify-center bg-blue-900/50">{num}</button>
                                    ))}
                                </div>
                            ) : (
                                <div class="bg-white p-10 rounded-sm shadow-2xl inline-block animate-in zoom-in">
                                    <Icon name="gauge" size={40} className="mx-auto text-[#C8102E] mb-6" />
                                    <p class="text-xl font-black text-slate-900 uppercase mb-2">{surveyScore > 3 ? "High Friction Detected" : "Maintain Ops"}</p>
                                    <p class="text-slate-500 text-sm font-medium mb-6">{surveyScore > 3 ? "Your unit is a prime candidate for modernization. Let's fix it." : "Your unit is running lean. Join us as a Fellow to help others!"}</p>
                                    <button onClick={() => setSurveyScore(null)} class="text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-200">Reset Gauge</button>
                                </div>
                            )}
                        </div>
                    </section>
                </div>
            );

            const ProcessPage = () => (
                <div class="max-w-4xl mx-auto px-6 py-24">
                    <div class="text-center mb-24">
                        <div class="w-12 h-1 bg-[#C8102E] mx-auto mb-8"></div>
                        <h2 class="text-5xl font-black text-slate-900 uppercase tracking-tighter leading-none mb-4">How we build <br /> for you</h2>
                        <p class="text-slate-500 font-bold uppercase text-[10px] tracking-[0.4em]">6 Simple Steps to Modernized Readiness</p>
                    </div>

                    <div class="mb-24 flex flex-wrap items-center justify-between gap-8">
                        {['Define', 'Develop', 'Build', 'Test', 'Deploy'].map((item, i) => (
                            <div key={i} class="flex flex-col items-center group">
                                <div class="w-16 h-16 rounded-full bg-slate-50 border-2 border-slate-200 flex items-center justify-center text-[#003087] group-hover:bg-[#FFC72C] transition-all">
                                    <span class="font-black">{i+1}</span>
                                </div>
                                <p class="mt-4 text-[10px] font-black uppercase text-[#003087]">{item}</p>
                            </div>
                        ))}
                    </div>

                    <div class="space-y-4">
                        {[
                            { title: "Define the Battlefield", desc: "We sit with you to see the problem from your perspective. No guessing." },
                            { title: "Design the Brief", desc: "We map the exact pain points and identify the simplest path to success." },
                            { title: "Rapid 30-Day Sprint", desc: "The Innovation Cell builds a functional working prototype in weeks, not years." },
                            { title: "Enterprise Tools", desc: "We use the platform you already own: Power BI, Power Apps, and SharePoint." },
                            { title: "Test Under Fire", desc: "You use the tool while you work. If it's hard to use, we fix it immediately." },
                            { title: "Deploy & Iterate", desc: "The tool goes live and we keep improving it based on your feedback." }
                        ].map((step, i) => (
                            <div key={i} class="flex gap-6 p-8 bg-slate-50 border border-slate-200 rounded-lg hover:bg-white transition-all group">
                                <span class="text-4xl font-black text-[#003087]/10 group-hover:text-[#FFC72C]">0{i + 1}</span>
                                <div>
                                    <h4 class="text-sm font-black text-slate-900 uppercase tracking-widest mb-2">{step.title}</h4>
                                    <p class="text-slate-500 text-sm font-medium">{step.desc}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            const LibraryPage = () => (
                <div class="max-w-6xl mx-auto px-6 py-24">
                    <div class="text-center mb-24">
                        <div class="w-12 h-1 bg-[#FFC72C] mx-auto mb-8"></div>
                        <h2 class="text-5xl font-black text-slate-900 uppercase tracking-tighter leading-none mb-4 italic">Flight Library</h2>
                        <p class="text-slate-500 font-bold uppercase text-[10px] tracking-[0.4em]">Strategic Field Guides</p>
                    </div>
                    <div class="grid md:grid-cols-3 gap-8">
                        {[
                            { title: 'Innovation Playbook', sub: 'The Product Approach', icon: 'book-open', accent: 'bg-[#003087]' },
                            { title: 'Power App Guide', sub: 'Rapid Application Build', icon: 'layout', accent: 'bg-[#C8102E]' },
                            { title: 'Power BI Briefing', sub: 'Data Dominance', icon: 'bar-chart-3', accent: 'bg-[#FFC72C]' },
                            { title: 'Automation Mission', sub: 'Power Automate', icon: 'zap', accent: 'bg-[#003087]' },
                            { title: 'Tactical Recon', sub: 'Process Mapping', icon: 'search', accent: 'bg-slate-900' },
                            { title: 'Success Metrics', sub: 'Outputs to Outcomes', icon: 'gauge', accent: 'bg-slate-400' },
                        ].map((guide, i) => (
                            <div key={i} class="bg-white border-2 border-slate-50 rounded-2xl p-8 hover:shadow-2xl transition-all flex flex-col group h-full cursor-pointer">
                                <div class={`w-12 h-12 ${guide.accent} text-white flex items-center justify-center rounded-xl mb-6 shadow-lg`}>
                                    <Icon name={guide.icon} size={22} />
                                </div>
                                <p class="text-[10px] font-black uppercase text-slate-400 mb-1">{guide.sub}</p>
                                <h4 class="text-xl font-black text-slate-900 uppercase tracking-tighter mb-4">{guide.title}</h4>
                                <div class="mt-auto pt-6 border-t border-slate-50 flex items-center justify-between text-[#003087] font-black uppercase text-[10px]">
                                    <span>Download Resource</span>
                                    <Icon name="arrow-right" size={16} />
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            const SubmitPage = () => (
                <div class="max-w-4xl mx-auto px-6 py-24">
                    <div class="bg-white shadow-2xl rounded-sm overflow-hidden border border-slate-200">
                        <div class="bg-[#003087] py-12 px-8 text-white relative">
                            <h2 class="text-4xl font-black uppercase tracking-tighter mb-2 italic">Fix a mission process</h2>
                            <p class="text-blue-200 text-[10px] font-bold uppercase tracking-[0.4em]">Submit a Modernization Request</p>
                        </div>
                        <form class="p-8 md:p-12 space-y-10" onSubmit={(e) => { e.preventDefault(); alert("Modernization request submitted for review."); }}>
                            <div class="grid md:grid-cols-2 gap-10">
                                <div class="space-y-2">
                                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest text-left block">Operator Name / Rank</label>
                                    <input type="text" class="w-full bg-slate-50 border-b-2 border-slate-200 px-4 py-4 focus:border-[#003087] outline-none font-bold text-slate-800" required />
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest text-left block">Assigned Unit</label>
                                    <input type="text" class="w-full bg-slate-50 border-b-2 border-slate-200 px-4 py-4 focus:border-[#003087] outline-none font-bold text-slate-800" required />
                                </div>
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block text-left uppercase tracking-[0.2em]">Describe the manual bottleneck</label>
                                <p class="text-[11px] text-slate-400 mb-2 font-medium">What is the spreadsheet, email chain, or manual task that wastes the most time?</p>
                                <textarea rows="5" class="w-full bg-slate-50 border-2 border-slate-100 p-4 focus:border-[#003087] outline-none font-medium text-slate-800 resize-none" required></textarea>
                            </div>
                            <button type="submit" class="w-full bg-[#FFC72C] text-[#003087] font-black py-6 text-sm uppercase tracking-[0.2em] shadow-lg hover:bg-[#ffe082] transition-all rounded-sm">
                                Submit for modernization
                            </button>
                        </form>
                    </div>
                </div>
            );

            const JoinPage = () => (
                <div class="max-w-4xl mx-auto px-6 py-24">
                    <div class="text-center mb-20">
                        <h2 class="text-5xl font-black text-slate-900 uppercase tracking-tighter leading-none mb-6">Build the <br /> Future</h2>
                        <p class="text-slate-600 font-medium max-w-xl mx-auto leading-relaxed">We need 6-10 Airmen for our next fellowship cycle. Bring a problem from your unit; leave with a modernization roadmap.</p>
                    </div>
                    <div class="bg-[#003087] p-8 md:p-16 rounded-2xl relative shadow-2xl overflow-hidden">
                        <form class="space-y-12 relative z-10" onSubmit={(e) => { e.preventDefault(); alert("Interest registered."); }}>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-blue-200 uppercase tracking-widest block text-left">Military Email (.mil)</label>
                                <input type="email" placeholder="jane.doe@us.af.mil" class="w-full bg-transparent border-b-4 border-blue-400/30 py-4 outline-none focus:border-[#FFC72C] transition-colors text-2xl font-black tracking-tight text-white placeholder-blue-300" required />
                            </div>
                            <div class="grid md:grid-cols-2 gap-12">
                                <div class="space-y-2">
                                    <label class="text-[10px] font-black text-blue-200 uppercase tracking-widest block text-left">What is your AFSC?</label>
                                    <input type="text" placeholder="e.g. 17S, 3F5, 2A6" class="w-full bg-transparent border-b-4 border-blue-400/30 py-4 outline-none focus:border-[#FFC72C] transition-colors text-2xl font-black text-white" required />
                                </div>
                                <div class="space-y-4 pt-2">
                                    <div class="flex items-center gap-3 text-blue-100 text-[10px] font-black uppercase"><div class="w-2 h-2 rounded-full bg-[#FFC72C]"></div> 4 Hours/Week Commitment</div>
                                    <div class="flex items-center gap-3 text-blue-100 text-[10px] font-black uppercase"><div class="w-2 h-2 rounded-full bg-[#FFC72C]"></div> Work on real Wing problems</div>
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-white text-[#003087] font-black py-6 text-sm uppercase tracking-[0.3em] rounded-sm shadow-xl hover:bg-slate-50 transition-all">Tell us you're interested</button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div class="min-h-screen">
                    <Nav />
                    <main>
                        {activeTab === 'home' && <HomePage />}
                        {activeTab === 'process' && <ProcessPage />}
                        {activeTab === 'library' && <LibraryPage />}
                        {activeTab === 'submit' && <SubmitPage />}
                        {activeTab === 'join' && <JoinPage />}
                    </main>
                    <footer class="bg-slate-50 border-t border-slate-200 py-24 px-6 relative mt-20">
                        <div class="absolute top-0 left-0 w-full h-1 bg-[#C8102E]"></div>
                        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-12 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                            <div class="flex items-center gap-4">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e0/California_Air_National_Guard_USAF_patch.svg" alt="CA ANG" class="w-10 h-10 grayscale opacity-40" />
                                <span>HQ California Air National Guard • 2026</span>
                            </div>
                            <div class="flex gap-8">
                                <span>Built for Mission Execution</span>
                                <span>Modernization Initiative</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
