<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA ANG | Innovation Cell</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for Browser JSX Transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .animate-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-white text-slate-900 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        // Destructure hooks from React
        const { useState, useEffect } = React;

        // Custom Icon Component to handle Lucide in browser
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
        };

        const Button = ({ children, onClick, variant = 'primary', className = '', type = 'button', icon: iconName }) => {
            const baseStyles = "px-6 py-4 rounded-xl font-bold uppercase text-xs tracking-[0.2em] transition-all flex items-center justify-center gap-3 hover:scale-[1.02] active:scale-[0.98]";
            const variants = {
                primary: "bg-[#003087] text-white shadow-lg hover:bg-[#002147]",
                secondary: "bg-white border-2 border-slate-200 text-slate-700 hover:border-[#003087]",
            };

            return (
                <button type={type} onClick={onClick} className={`${baseStyles} ${variants[variant]} ${className}`}>
                    {children}
                    {iconName && <Icon name={iconName} size={18} />}
                </button>
            );
        };

        const SectionHeader = ({ badge, title, subtitle }) => (
            <div className="mb-16 text-center">
                <div className="inline-flex items-center gap-2 px-3 py-1 bg-blue-50 border border-blue-100 rounded-full text-[#003087] text-[10px] font-black uppercase tracking-widest mb-4">
                    {badge}
                </div>
                <h2 className="text-4xl md:text-5xl font-black tracking-tight text-slate-900 mb-6 italic">{title}</h2>
                {subtitle && <p className="text-lg text-slate-600 max-w-2xl mx-auto font-medium">{subtitle}</p>}
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [surveyScore, setSurveyScore] = useState(null);
            const [formStatus, setFormStatus] = useState({ type: '', message: '' });

            const handleFormSubmit = (e, type) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());
                const recipient = "innovation@caang.mil";
                const subject = type === 'submit' ? `Modernization Request: ${data.unit}` : `Fellowship Interest: ${data.name}`;
                const body = `Type: ${type}\nName: ${data.name}\nUnit: ${data.unit}\nEmail: ${data.email}\nDetails: ${data.description}`;
                
                window.location.href = `mailto:${recipient}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
                setFormStatus({ type: 'success', message: 'Email client opening...' });
                setTimeout(() => setFormStatus({ type: '', message: '' }), 5000);
            };

            const navItems = [
                { id: 'home', label: 'Home', icon: 'shield-check' },
                { id: 'process', label: 'Workflow', icon: 'zap' },
                { id: 'library', label: 'Guides', icon: 'book-open' },
                { id: 'submit', label: 'Modernize', icon: 'plus-circle' },
                { id: 'join', label: 'Fellowship', icon: 'users' }
            ];

            const HomeView = () => (
                <div className="space-y-32">
                    <section className="relative pt-20 pb-32 text-center">
                        <div className="max-w-6xl mx-auto px-6">
                            <div className="inline-flex items-center gap-3 px-4 py-2 bg-white border border-slate-200 rounded-full text-[#003087] text-xs font-black uppercase tracking-widest mb-10 shadow-sm">
                                <Icon name="cpu" size={14} /> Mission-Ready Digital Systems
                            </div>
                            <h1 className="text-6xl md:text-8xl font-black tracking-tight leading-[1.1] mb-10">
                                Stop fighting data.<br/>
                                <span className="text-[#003087] italic underline decoration-[#FFC72C] decoration-8 underline-offset-8">Move the mission.</span>
                            </h1>
                            <p className="text-xl md:text-2xl text-slate-600 max-w-3xl mx-auto mb-14 leading-relaxed font-medium">
                                We replace manual, paper-based friction with digital tools built specifically for the CA ANG.
                            </p>
                            <div className="flex flex-col sm:flex-row justify-center gap-4">
                                <Button onClick={() => setActiveTab('submit')} icon="arrow-right">Submit a Bottleneck</Button>
                                <Button variant="secondary" onClick={() => setActiveTab('library')}>Explore Field Guides</Button>
                            </div>
                        </div>
                    </section>
                </div>
            );

            const FormView = ({ type }) => (
                <div className="max-w-4xl mx-auto px-6 py-20 animate-in">
                    <div className="bg-white rounded-[3rem] shadow-2xl border border-slate-200 overflow-hidden">
                        <div className="p-10 md:p-16 border-b border-slate-100 bg-slate-50">
                            <h2 className="text-4xl font-black text-slate-900 mb-4 italic">{type === 'submit' ? "Fix a Problem" : "Join Fellowship"}</h2>
                            <p className="text-slate-500 font-semibold uppercase text-xs tracking-[0.3em]">Direct email submission to the Innovation Cell.</p>
                        </div>
                        <form className="p-10 md:p-16 space-y-8" onSubmit={(e) => handleFormSubmit(e, type)}>
                            <div className="grid md:grid-cols-2 gap-8">
                                <input required name="name" className="w-full px-6 py-4 rounded-xl bg-slate-50 border-2 border-transparent focus:border-[#003087] focus:bg-white outline-none font-semibold" placeholder="Name / Rank" />
                                <input required name="email" type="email" className="w-full px-6 py-4 rounded-xl bg-slate-50 border-2 border-transparent focus:border-[#003087] focus:bg-white outline-none font-semibold" placeholder=".mil Email" />
                            </div>
                            <input required name="unit" className="w-full px-6 py-4 rounded-xl bg-slate-50 border-2 border-transparent focus:border-[#003087] focus:bg-white outline-none font-semibold" placeholder="Unit / Wing" />
                            <textarea required name="description" rows="4" className="w-full px-6 py-4 rounded-xl bg-slate-50 border-2 border-transparent focus:border-[#003087] focus:bg-white outline-none font-medium resize-none" placeholder="Describe the manual process or your interest..."></textarea>
                            <Button type="submit" className="w-full">Open Email to Send</Button>
                            {formStatus.message && <div className="text-center text-emerald-600 font-bold">{formStatus.message}</div>}
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen">
                    <nav className="sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b border-slate-100 h-20 flex items-center">
                        <div className="max-w-7xl mx-auto px-6 w-full flex justify-between items-center">
                            <button onClick={() => setActiveTab('home')} className="flex items-center gap-4">
                                <div className="w-10 h-10 bg-[#003087] rounded-xl flex items-center justify-center text-[#FFC72C]"><Icon name="shield-check" size={24} /></div>
                                <div className="text-left"><div className="font-black text-lg leading-none">CA ANG</div><div className="text-[10px] uppercase font-black text-[#003087] tracking-widest">Innovation Cell</div></div>
                            </button>
                            <div className="hidden lg:flex gap-2">
                                {navItems.map(item => (
                                    <button key={item.id} onClick={() => setActiveTab(item.id)} className={`px-5 py-2 rounded-full text-[11px] font-black uppercase tracking-widest ${activeTab === item.id ? 'bg-blue-50 text-[#003087]' : 'text-slate-400'}`}>{item.label}</button>
                                ))}
                            </div>
                        </div>
                    </nav>
                    <main>
                        {activeTab === 'home' && <HomeView />}
                        {activeTab === 'submit' && <FormView type="submit" />}
                        {activeTab === 'join' && <FormView type="join" />}
                        {activeTab === 'process' && <div className="py-20 text-center font-bold">Workflow details coming soon.</div>}
                        {activeTab === 'library' && <div className="py-20 text-center font-bold">Field guides coming soon.</div>}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
