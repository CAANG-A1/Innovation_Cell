<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA ANG | Innovation Cell</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus+Jakarta+Sans', sans-serif; 
            scroll-behavior: smooth; 
            background-color: #ffffff;
            font-size: 16px;
        }

        .hero-gradient {
            background: radial-gradient(circle at 0% 0%, rgba(0, 48, 135, 0.04) 0%, transparent 50%),
                        radial-gradient(circle at 100% 100%, rgba(255, 199, 44, 0.06) 0%, transparent 50%);
        }

        .card-shadow {
            box-shadow: 0 10px 30px -5px rgba(0, 48, 135, 0.05);
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .animate-slide-up {
            animation: slideUp 0.5s ease-out forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-link-active {
            position: relative;
            color: #003087 !important;
        }
        .nav-link-active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #003087;
            border-radius: 2px;
        }
    </style>
</head>
<body class="text-slate-900 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [surveyScore, setSurveyScore] = useState(null);
            const [isMenuOpen, setIsMenuOpen] = useState(false);

            const navigation = [
                { id: 'home', label: 'Home', icon: 'home' },
                { id: 'process', label: 'How it Works', icon: 'zap' },
                { id: 'library', label: 'Field Guides', icon: 'book-open' },
                { id: 'submit', label: 'Fix a Problem', icon: 'plus-circle' },
                { id: 'join', label: 'Join Us', icon: 'users' }
            ];

            const Nav = () => (
                <nav class="glass border-b border-slate-200 sticky top-0 z-50">
                    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                        <div class="flex items-center gap-4 cursor-pointer group" onClick={() => setActiveTab('home')}>
                            <div class="relative w-12 h-12 flex items-center justify-center">
                                <img src="CAANG%20flash.png" alt="CA ANG" class="w-10 h-10 relative object-contain" />
                            </div>
                            <div class="flex flex-col">
                                <span class="font-extrabold text-lg tracking-tight leading-none text-slate-900">CA ANG</span>
                                <span class="text-xs uppercase font-bold text-[#003087] tracking-widest mt-0.5">Innovation Cell</span>
                            </div>
                        </div>

                        <div class="hidden lg:flex gap-8">
                            {navigation.map(tab => (
                                <button 
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    class={`relative py-1 text-sm font-bold uppercase tracking-wider transition-all hover:text-[#003087] ${
                                        activeTab === tab.id ? 'nav-link-active' : 'text-slate-500'
                                    }`}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </div>

                        <button onClick={() => setIsMenuOpen(!isMenuOpen)} class="lg:hidden p-2 text-slate-900">
                            <Icon name={isMenuOpen ? "x" : "menu"} size={28} />
                        </button>
                    </div>

                    {isMenuOpen && (
                        <div class="lg:hidden bg-white border-t p-6 space-y-3 animate-slide-up shadow-2xl">
                            {navigation.map(tab => (
                                <button 
                                    key={tab.id}
                                    onClick={() => { setActiveTab(tab.id); setIsMenuOpen(false); }}
                                    class={`w-full flex items-center gap-4 px-5 py-4 rounded-xl font-bold text-sm tracking-wide ${
                                        activeTab === tab.id ? 'bg-blue-50 text-[#003087]' : 'text-slate-600 hover:bg-slate-50'
                                    }`}
                                >
                                    <Icon name={tab.icon} size={20} />
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                    )}
                </nav>
            );

            const HomePage = () => (
                <div class="space-y-32 pb-32 hero-gradient">
                    <section class="max-w-6xl mx-auto px-6 pt-24 text-center">
                        <div class="inline-flex items-center gap-3 px-4 py-2 bg-blue-50 border border-blue-100 rounded-full text-[#003087] text-sm font-bold uppercase tracking-wider mb-10 animate-slide-up">
                            <Icon name="shield-check" size={16} />
                            Building Digital Tools for Airmen
                        </div>
                        <h1 class="text-6xl md:text-8xl font-black tracking-tight leading-[1.1] text-slate-900 mb-10 animate-slide-up">
                            Stop fighting data. <br/>
                            <span class="text-[#003087]">Move the mission.</span>
                        </h1>
                        <p class="text-xl md:text-2xl text-slate-600 max-w-3xl mx-auto mb-14 leading-relaxed font-medium animate-slide-up" style={{ animationDelay: '0.1s' }}>
                            We replace slow, manual workflows with simple digital apps that work for you, not against you. 
                        </p>
                        <div class="flex flex-col sm:flex-row justify-center gap-6 animate-slide-up" style={{ animationDelay: '0.2s' }}>
                            <button onClick={() => setActiveTab('submit')} class="px-10 py-5 bg-[#003087] text-white rounded-2xl font-bold uppercase text-sm tracking-widest hover:bg-[#002147] transition-all shadow-xl hover:shadow-2xl hover:scale-[1.02] flex items-center justify-center gap-3">
                                Fix my process <Icon name="arrow-right" size={20} />
                            </button>
                            <button onClick={() => setActiveTab('library')} class="px-10 py-5 bg-white border-2 border-slate-200 text-slate-700 rounded-2xl font-bold uppercase text-sm tracking-widest hover:border-[#FFC72C] transition-all flex items-center justify-center gap-3">
                                View Field Guides
                            </button>
                        </div>
                    </section>

                    <section class="max-w-6xl mx-auto px-6">
                        <div class="grid md:grid-cols-2 gap-10 items-stretch">
                            <div class="bg-slate-50 p-12 rounded-[2.5rem] border border-slate-200/60 flex flex-col h-full shadow-sm">
                                <div class="w-14 h-14 bg-white border border-slate-200 rounded-2xl flex items-center justify-center text-slate-400 mb-8 shadow-sm">
                                    <Icon name="clock" size={28} />
                                </div>
                                <h3 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-2">The Current Way</h3>
                                <h4 class="text-3xl font-extrabold tracking-tight text-slate-800 mb-10">The Paper Burden</h4>
                                <ul class="space-y-8 font-medium text-slate-600">
                                    <li class="flex items-start gap-5">
                                        <div class="w-6 h-6 bg-red-100 text-red-600 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5"><Icon name="x" size={14} /></div>
                                        <span class="text-lg">Manual spreadsheets that take hours to update.</span>
                                    </li>
                                    <li class="flex items-start gap-5">
                                        <div class="w-6 h-6 bg-red-100 text-red-600 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5"><Icon name="x" size={14} /></div>
                                        <span class="text-lg">Chasing down status updates through email chains.</span>
                                    </li>
                                    <li class="flex items-start gap-5">
                                        <div class="w-6 h-6 bg-red-100 text-red-600 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5"><Icon name="x" size={14} /></div>
                                        <span class="text-lg">Data errors caused by manual hand-offs and typing.</span>
                                    </li>
                                </ul>
                            </div>

                            <div class="bg-white p-12 rounded-[2.5rem] border-2 border-blue-50 card-shadow flex flex-col h-full relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-48 h-48 bg-[#FFC72C]/5 rounded-full -mr-20 -mt-20"></div>
                                <div class="w-14 h-14 bg-[#003087] rounded-2xl flex items-center justify-center text-[#FFC72C] mb-8 shadow-lg">
                                    <Icon name="zap" size={28} />
                                </div>
                                <h3 class="text-sm font-black text-[#003087] uppercase tracking-widest mb-2">The Innovation Way</h3>
                                <h4 class="text-3xl font-extrabold tracking-tight text-slate-900 mb-10">The Modern Fix</h4>
                                <ul class="space-y-8 font-bold text-slate-700">
                                    <li class="flex items-start gap-5">
                                        <div class="w-6 h-6 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5"><Icon name="check" size={14} /></div>
                                        <span class="text-lg">Live apps that work on tablets and mobile devices.</span>
                                    </li>
                                    <li class="flex items-start gap-5">
                                        <div class="w-6 h-6 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5"><Icon name="check" size={14} /></div>
                                        <span class="text-lg">Automated notifications so you never miss a deadline.</span>
                                    </li>
                                    <li class="flex items-start gap-5">
                                        <div class="w-6 h-6 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5"><Icon name="check" size={14} /></div>
                                        <span class="text-lg">Live dashboards showing mission readiness instantly.</span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </section>

                    <section class="max-w-4xl mx-auto px-6 text-center">
                        <div class="bg-slate-50 border border-slate-200/60 p-16 md:p-24 rounded-[3.5rem] relative overflow-hidden">
                            <div class="relative z-10">
                                <h2 class="text-sm font-black text-[#003087] uppercase tracking-[0.4em] mb-6">Self-Assessment</h2>
                                <h3 class="text-4xl md:text-5xl font-black tracking-tight text-slate-900 mb-8 leading-tight">Is your unit stuck?</h3>
                                <p class="text-lg text-slate-600 mb-14 max-w-xl mx-auto font-medium">On a scale of 1 to 5, how much does manual paperwork slow down your team every day?</p>
                                
                                {surveyScore === null ? (
                                    <div class="flex flex-wrap justify-center gap-6">
                                        {[1, 2, 3, 4, 5].map(num => (
                                            <button 
                                                key={num} 
                                                onClick={() => setSurveyScore(num)}
                                                class="w-20 h-20 rounded-3xl bg-white border-2 border-slate-100 text-slate-400 font-extrabold hover:border-[#003087] hover:text-[#003087] hover:scale-110 transition-all flex items-center justify-center text-3xl shadow-sm hover:shadow-md"
                                            >
                                                {num}
                                            </button>
                                        ))}
                                    </div>
                                ) : (
                                    <div class="animate-slide-up bg-white p-12 rounded-[2rem] card-shadow inline-block max-w-md border border-blue-50">
                                        <div class="w-16 h-16 bg-blue-50 text-[#003087] rounded-2xl flex items-center justify-center mx-auto mb-8 shadow-sm">
                                            <Icon name="gauge" size={32} />
                                        </div>
                                        <h4 class="text-2xl font-extrabold tracking-tight text-slate-900 mb-4">
                                            {surveyScore > 3 ? "Change is Needed" : "Unit is Running Lean"}
                                        </h4>
                                        <p class="text-base text-slate-600 font-medium mb-10 leading-relaxed">
                                            {surveyScore > 3 
                                                ? "Manual friction is taking valuable time away from your mission. We have the tools to help you reclaim those hours." 
                                                : "Excellent. Your unit is high-performing. Help other wings reach this level by joining us as a Fellow."}
                                        </p>
                                        <div class="flex flex-col gap-4">
                                            <button onClick={() => setActiveTab('submit')} class="w-full py-5 bg-[#003087] text-white rounded-xl font-bold uppercase text-sm tracking-widest shadow-lg">Start a Request</button>
                                            <button onClick={() => setSurveyScore(null)} class="text-sm font-bold text-slate-400 uppercase tracking-widest hover:text-slate-700 transition-colors">Reset Gauge</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </section>
                </div>
            );

            const ProcessPage = () => (
                <div class="max-w-6xl mx-auto px-6 py-24">
                    <div class="text-center mb-24">
                        <h2 class="text-sm font-black text-[#003087] uppercase tracking-[0.4em] mb-6">Execution Model</h2>
                        <h3 class="text-5xl md:text-7xl font-black tracking-tight text-slate-900 mb-8">6 Steps to Success</h3>
                        <p class="text-xl text-slate-600 max-w-2xl mx-auto font-medium leading-relaxed">We build tools that Airmen actually enjoy using.</p>
                    </div>

                    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-12">
                        {[
                            { step: "01", title: "We Observe", desc: "We sit with you to see the friction firsthand. We don't guess—we learn your workflow.", icon: "eye" },
                            { step: "02", title: "We Map It", desc: "We visualize where data is stuck and draw a clear path to a better digital state.", icon: "map" },
                            { step: "03", title: "We Sprint", desc: "Our team builds a functional, working version of your tool in 30 days or less.", icon: "zap" },
                            { step: "04", title: "We Use Your Tools", desc: "We build on the Power Platform and SharePoint you already own. No new accounts.", icon: "box" },
                            { step: "05", title: "We Test Hard", desc: "You use it in the field. If it's slow or confusing, we change it immediately.", icon: "shield-alert" },
                            { step: "06", title: "We Launch", desc: "The tool goes live wing-wide. We keep iterating based on your ongoing feedback.", icon: "rocket" }
                        ].map(item => (
                            <div key={item.step} class="group">
                                <div class="w-16 h-16 bg-slate-50 text-slate-400 rounded-2xl flex items-center justify-center mb-8 group-hover:bg-[#003087] group-hover:text-white transition-all shadow-sm border border-slate-100">
                                    <Icon name={item.icon} size={28} />
                                </div>
                                <h4 class="text-2xl font-extrabold tracking-tight mb-4 text-slate-900 flex items-center gap-4">
                                    <span class="text-[#003087]/20 text-lg">{item.step}</span> {item.title}
                                </h4>
                                <p class="text-lg text-slate-600 font-medium leading-relaxed">{item.desc}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );

            const LibraryPage = () => {
                const guides = [
                    { title: 'Innovation Playbook', sub: 'The Product Approach', icon: 'book', color: 'bg-slate-900', url: '/Innovation_Cell/guides/Mission_Ready_Innovation_Field_Guide.pdf' },
                    { title: 'Power App Guide', sub: 'Rapid Deployment', icon: 'layout', color: 'bg-blue-700', url: '/Innovation_Cell/guides/Mission_Power_App_Deployment.pdf' },
                    { title: 'Power BI Briefing', sub: 'Data Dominance', icon: 'bar-chart', color: 'bg-[#FFC72C]', url: '/Innovation_Cell/guides/Data_Dominance_Power_BI_Flight_Briefing.pdf' },
                    { title: 'Automation Mission', sub: 'Power Automate', icon: 'zap', color: 'bg-red-700', url: '/Innovation_Cell/guides/Power_Automate_Mission_Guide.pdf' }
                ];

                return (
                    <div class="max-w-7xl mx-auto px-6 py-24">
                        <div class="text-center mb-24">
                            <h2 class="text-sm font-black text-slate-400 uppercase tracking-[0.4em] mb-6">Strategic Resources</h2>
                            <h3 class="text-5xl md:text-7xl font-black tracking-tight text-slate-900 mb-8 italic">Field Guides</h3>
                            <p class="text-xl text-slate-600 max-w-xl mx-auto font-medium">Step-by-step guides for mission modernization.</p>
                        </div>

                        <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-10">
                            {guides.map((guide, i) => (
                                <a key={i} href={guide.url} download class="bg-white p-12 rounded-[2.5rem] border border-slate-200 card-shadow hover:translate-y-[-8px] transition-all flex flex-col h-full no-underline group">
                                    <div class={`w-14 h-14 ${guide.color} rounded-2xl flex items-center justify-center text-white mb-10 shadow-lg`}>
                                        <Icon name={guide.icon} size={26} />
                                    </div>
                                    <p class="text-xs font-black uppercase tracking-widest text-slate-400 mb-2">{guide.sub}</p>
                                    <h4 class="text-2xl font-extrabold tracking-tight text-slate-900 mb-12 leading-tight group-hover:text-[#003087] transition-colors">{guide.title}</h4>
                                    <div class="mt-auto flex items-center justify-between text-[#003087] font-bold uppercase text-xs tracking-widest pt-8 border-t border-slate-100">
                                        <span>Download PDF</span>
                                        <Icon name="download" size={18} />
                                    </div>
                                </a>
                            ))}
                        </div>
                    </div>
                );
            };

            const SubmitPage = () => (
                <div class="max-w-4xl mx-auto px-6 py-24">
                    <div class="bg-white rounded-[3rem] overflow-hidden card-shadow border border-slate-200/60">
                        <div class="bg-slate-50 border-b border-slate-200 px-12 py-20 text-center">
                            <h2 class="text-5xl font-black tracking-tight mb-4 text-slate-900 italic">Fix a mission process</h2>
                            <p class="text-slate-500 font-bold uppercase text-sm tracking-[0.3em]">Tell us what is broken. We will build the fix.</p>
                        </div>
                        <form class="p-12 md:p-20 space-y-14" onSubmit={(e) => {
                            e.preventDefault();
                            const formData = new FormData(e.target);
                            const body = `Process Modernization Request\n\nName: ${formData.get('name')}\nUnit: ${formData.get('unit')}\nProblem: ${formData.get('problem')}`;
                            window.location.href = `mailto:blake.carter.10@us.af.mil?subject=CA ANG Fix Request&body=${encodeURIComponent(body)}`;
                        }}>
                            <div class="grid md:grid-cols-2 gap-12">
                                <div class="space-y-4 text-left">
                                    <label class="text-sm font-black text-slate-500 uppercase tracking-widest block">What is your name?</label>
                                    <input name="name" type="text" class="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl p-6 focus:border-[#003087] focus:bg-white outline-none font-bold transition-all text-lg placeholder-slate-300" placeholder="e.g. MSgt Snuffy" required />
                                </div>
                                <div class="space-y-4 text-left">
                                    <label class="text-sm font-black text-slate-500 uppercase tracking-widest block">What is your unit?</label>
                                    <input name="unit" type="text" class="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl p-6 focus:border-[#003087] focus:bg-white outline-none font-bold transition-all text-lg placeholder-slate-300" placeholder="e.g. 144th FW" required />
                                </div>
                            </div>
                            <div class="space-y-4 text-left">
                                <label class="text-sm font-black text-slate-500 uppercase tracking-widest block tracking-widest">Describe the manual bottleneck</label>
                                <p class="text-base text-slate-400 font-medium mb-4">Tell us about the spreadsheet, paper form, or email chain that wastes the most time.</p>
                                <textarea name="problem" rows="6" class="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl p-6 focus:border-[#003087] focus:bg-white outline-none font-medium transition-all resize-none text-lg" required></textarea>
                            </div>
                            <button type="submit" class="w-full py-8 bg-[#003087] text-white rounded-2xl font-black uppercase text-base tracking-[0.3em] shadow-xl hover:bg-[#002147] transition-all hover:scale-[1.01]">Submit mission request</button>
                        </form>
                    </div>
                </div>
            );

            const JoinPage = () => (
                <div class="max-w-4xl mx-auto px-6 py-24 text-center">
                    <h2 class="text-sm font-black text-[#003087] uppercase tracking-[0.4em] mb-6">Innovation Fellowship</h2>
                    <h3 class="text-5xl md:text-7xl font-black tracking-tight text-slate-900 mb-10">Build the Future</h3>
                    <p class="text-xl text-slate-600 font-medium max-w-2xl mx-auto mb-20 leading-relaxed">
                        We are recruiting Airmen to help transform how our Wing operates. Bring a problem; we give you the tools and time to fix it.
                    </p>
                    
                    <div class="bg-white rounded-[3.5rem] p-16 md:p-24 border border-slate-200 card-shadow text-left relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-64 h-64 bg-[#FFC72C]/5 rounded-full -mr-24 -mt-24"></div>
                        <form class="relative z-10 space-y-20" onSubmit={(e) => {
                            e.preventDefault();
                            const formData = new FormData(e.target);
                            const body = `Fellowship Interest\n\nEmail: ${formData.get('email')}\nAFSC: ${formData.get('afsc')}`;
                            window.location.href = `mailto:blake.carter.10@us.af.mil?subject=CA ANG Fellowship Interest&body=${encodeURIComponent(body)}`;
                        }}>
                            <div class="space-y-6">
                                <label class="text-sm font-black text-slate-500 uppercase tracking-widest block">Military Email (.mil)</label>
                                <input name="email" type="email" placeholder="jane.doe@us.af.mil" class="w-full bg-transparent border-b-4 border-slate-100 py-6 outline-none focus:border-[#003087] transition-colors text-4xl font-black tracking-tight text-slate-900 placeholder-slate-100" required />
                            </div>
                            <div class="grid md:grid-cols-2 gap-20">
                                <div class="space-y-6">
                                    <label class="text-sm font-black text-slate-500 uppercase tracking-widest block">What is your AFSC?</label>
                                    <input name="afsc" type="text" placeholder="e.g. 17S, 3F5" class="w-full bg-transparent border-b-4 border-slate-100 py-6 outline-none focus:border-[#003087] transition-colors text-4xl font-black text-slate-900 placeholder-slate-100" required />
                                </div>
                                <div class="flex flex-col justify-center space-y-6 border-l-4 border-slate-50 pl-14">
                                    <div class="flex items-center gap-5 text-sm font-black uppercase text-slate-500"><div class="w-3 h-3 rounded-full bg-[#FFC72C]"></div> 4 Hours / Week</div>
                                    <div class="flex items-center gap-5 text-sm font-black uppercase text-slate-500"><div class="w-3 h-3 rounded-full bg-[#FFC72C]"></div> Remote & Flex-Time</div>
                                    <div class="flex items-center gap-5 text-sm font-black uppercase text-slate-500"><div class="w-3 h-3 rounded-full bg-[#FFC72C]"></div> Direct Wing Impact</div>
                                </div>
                            </div>
                            <button type="submit" class="w-full py-8 bg-[#003087] text-white rounded-3xl font-black uppercase text-base tracking-[0.3em] shadow-xl hover:bg-[#002147] transition-all">Tell us you're interested</button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div class="min-h-screen">
                    <Nav />
                    <main>
                        {activeTab === 'home' && <HomePage />}
                        {activeTab === 'process' && <ProcessPage />}
                        {activeTab === 'library' && <LibraryPage />}
                        {activeTab === 'submit' && <SubmitPage />}
                        {activeTab === 'join' && <JoinPage />}
                    </main>
                    <footer class="bg-slate-50 border-t border-slate-200 py-24 px-6 mt-32">
